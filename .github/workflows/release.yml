name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0). Empty uses pyproject version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(python -c "import pathlib,re; t=pathlib.Path('pyproject.toml').read_text(); print(re.search(r'^version\s*=\s*\"([^\"]+)\"', t, re.M).group(1))")"
          fi
          TAG="${TAG#v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=v${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building release v${TAG}"

      - name: Build release artifacts
        env:
          BLAZECODE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build wheel
          chmod +x scripts/build_release.sh install.sh
          PKG="$(python -c "import pathlib,re; t=pathlib.Path('pyproject.toml').read_text(); print(re.search(r'^version\s*=\s*\"([^\"]+)\"', t, re.M).group(1))")"
          if [[ "${{ steps.ver.outputs.version }}" != "$PKG" ]]; then
            echo "error: tag ${{ steps.ver.outputs.version }} does not match pyproject $PKG" >&2
            exit 1
          fi
          ./scripts/build_release.sh
          ls -lah dist/release
          test "$(cat dist/release/VERSION)" = "${{ steps.ver.outputs.version }}"
          ls dist/release/blazecode-${{ steps.ver.outputs.version }}-*.whl


      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Blazecode ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
